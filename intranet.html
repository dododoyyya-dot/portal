<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>대한민국플라잉디스크연맹 인트라넷</title>
<link rel="icon" href="kfdf_logo.png">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Dotum,"돋움",sans-serif;font-size:12px;color:#222;background:#e9ebef;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font-family:inherit;font-size:12px;color:#222}
a{cursor:pointer}
.gw-ic{vertical-align:-3px;flex:none}
/* 로그인 */
.gw-login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dfe2e7;padding:16px}
.gw-lgbox{width:100%;max-width:380px;background:#fff;border:1px solid #c5cad3;border-top:4px solid #3a5a9b}
.gw-lgbox h1{margin:0;padding:22px 26px 4px;font-size:18px;font-weight:700;color:#222;letter-spacing:-.3px}
.gw-lgbox h1 small{display:block;font-size:12px;font-weight:400;color:#777;margin-top:4px;letter-spacing:0}
.gw-lgbox form{padding:16px 26px 22px}
.gw-lgbox label{display:block;font-size:12px;color:#555;margin:10px 0 4px}
.gw-lgbox input{width:100%;height:36px;border:1px solid #bfc5cf;padding:0 10px;font-size:13px;outline:none;border-radius:0}
.gw-lgbox input:focus{border-color:#3a5a9b}
.gw-lgbox button{width:100%;height:40px;margin-top:16px;border:0;background:#3a5a9b;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.gw-lgbox button:disabled{opacity:.6}
.gw-lgerr{min-height:18px;margin-top:10px;color:#c0392b;font-size:12px}
.gw-lgfoot{border-top:1px solid #e3e6eb;padding:12px 26px;font-size:11.5px;color:#777;line-height:1.7;background:#f7f8fa}
/* 틀 */
.gw{display:none;flex-direction:column;height:100%;min-width:0}
.gw-top{flex:none;display:flex;align-items:stretch;height:80px;background:#fff;border-bottom:2px solid #3d8bd9}
.gw-brand{flex:none;width:214px;background:#4d4d52;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 14px;font-size:15px;font-weight:700;letter-spacing:-.5px;line-height:1.35}
.gw-brand small{font-size:11px;font-weight:400;color:#c9cbd1;letter-spacing:0}
.gw-nav{flex:1;display:flex;min-width:0;overflow-x:auto}
.gw-nav button{flex:none;width:90px;border:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:700;color:#333;cursor:pointer;border-bottom:3px solid transparent}
.gw-nav button svg{color:#3b6cc0}
.gw-nav button:hover{background:#f5f7fa}
.gw-nav button.on{background:#eef2f8;border-bottom-color:#3d8bd9}
.gw-user{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid #e1e4e9;font-size:12px}
.gw-user .av{width:34px;height:34px;border-radius:50%;background:#dfe2e7;color:#9aa1ad;display:flex;align-items:center;justify-content:center}
.gw-user .nm{display:flex;flex-direction:column;line-height:1.5;max-width:210px}
.gw-user .nm b{color:#2a62b8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-user .nm i{font-style:normal;color:#333;white-space:nowrap}
.gw-user button{border:1px solid #c5cad3;background:#fff;height:26px;padding:0 8px;cursor:pointer;color:#555}
.gw-body{flex:1;display:flex;min-height:0}
.gw-left{flex:none;width:214px;background:#f4f5f7;border-right:1px solid #d5d9e0;overflow-y:auto;padding:14px 0 20px}
.gw-new{position:relative;display:flex;margin:0 16px}
.gw-new .main{flex:1;height:36px;border:0;background:#4a5fc1;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.gw-new .dd{width:26px;border:0;border-left:1px solid #6f80d4;background:#4a5fc1;color:#fff;cursor:pointer}
.gw-new .menu{display:none;position:absolute;top:36px;left:0;right:0;background:#fff;border:1px solid #aab1be;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.gw-new .menu a{display:block;padding:8px 12px;font-size:12px}.gw-new .menu a:hover{background:#eef2f8}
.gw-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:14px 8px 10px;padding-bottom:12px;border-bottom:1px solid #d5d9e0}
.gw-quick button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.gw-quick .c{position:relative;width:34px;height:34px;border-radius:50%;background:#d3d7de;color:#fff;display:flex;align-items:center;justify-content:center}
.gw-quick .c.on{background:#5b8bd0}
.gw-quick em{position:absolute;right:-7px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:#f07c1f;color:#fff;font-style:normal;font-size:10px;font-weight:700;line-height:17px;text-align:center;padding:0 3px}
.gw-quick i{font-style:normal;font-size:11px;color:#333;letter-spacing:-.5px;white-space:nowrap}
.gw-tree{padding:0 10px}
.gw-tree .grp{font-size:12px;font-weight:700;color:#333;padding:8px 6px 4px;display:flex;align-items:center;gap:5px}
.gw-tree .grp svg,.gw-tree a svg{color:#9aa3b2}
.gw-tree a{display:flex;align-items:center;gap:5px;padding:4px 6px 4px 24px;font-size:12px;color:#333}
.gw-tree a:hover{background:#e6e9ee}.gw-tree a.on{background:#dbe4f3;font-weight:700;color:#1d4f9f}
.gw-tree a b{font-weight:700;color:#555;margin-left:2px}.gw-tree a b.hot{color:#e8590c}
.gw-main{flex:1;min-width:0;background:#fff;overflow:auto;padding:0 0 20px}
.gw-right{flex:none;width:226px;background:#f4f5f7;border-left:1px solid #d5d9e0;overflow-y:auto;padding:12px 10px}
.gw-right .box{background:#fff;border:1px solid #d5d9e0;margin-bottom:12px}
.gw-right h3{margin:0;padding:9px 10px;font-size:12.5px;font-weight:700;border-bottom:1px solid #e3e6eb}
.gw-right .box>a{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #eef0f3;color:#333;text-decoration:none;font-size:12px}
.gw-right .box>a:hover{background:#f5f7fa}.gw-right .box>a span{color:#777}
.gw-right .org{padding:8px 10px;font-weight:700;color:#2a62b8}
.gw-right .mem{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid #eef0f3;line-height:1.6}
.gw-right .mem .av{width:30px;height:30px;border-radius:50%;background:#dfe2e7;color:#9aa1ad;display:flex;align-items:center;justify-content:center;flex:none}
/* 목록 */
.gw-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 14px 10px;border-bottom:1px solid #d5d9e0}
.gw-bar h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:1px}.gw-bar h2 span{letter-spacing:0;font-weight:700}
.sp{flex:1}
.gw-bar label,.gw-search label{font-size:12px;color:#333;margin-left:6px;font-weight:700}
.gw-bar select,.gw-search input,.gw-tool select,.gw-form input,.gw-form select,.gw-form textarea,.gw-rep input{height:26px;border:1px solid #bfc5cf;background:#fff;padding:0 6px;border-radius:0;outline:none;max-width:100%}
.gw-search{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #e3e6eb}
.gw-search input#gwQ{width:140px}
.gw-tool{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:10px 14px}
.gw-b{height:26px;border:1px solid #b3b9c4;background:linear-gradient(#fff,#f3f4f6);padding:0 10px;cursor:pointer;color:#222;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-radius:2px}
.gw-b:hover{border-color:#7f8aa0}.gw-b.pri{background:#4a5fc1;border-color:#3d50a8;color:#fff;font-weight:700}.gw-b:disabled{opacity:.5}
.gw-say{font-size:12px;color:#1d6b3a;margin-left:8px}.gw-say.bad{color:#c0392b}
.gw-tblw{overflow-x:auto;padding:0}
.gw-tbl{width:100%;border-collapse:collapse;table-layout:fixed;min-width:900px;border-top:1px solid #c9ced7}
.gw-tbl th{background:#f6f7f9;font-weight:700;font-size:12px;color:#333;text-align:left;padding:8px 8px;border-bottom:1px solid #c9ced7;border-right:1px solid #e6e8ec;white-space:nowrap}
.gw-tbl td{padding:9px 8px;border-bottom:1px solid #e9ebef;font-size:12px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gw-tbl td.c{text-align:center}.gw-tbl td.t a{color:#222}.gw-tbl td.t a:hover{color:#1d4f9f;text-decoration:underline}
.gw-tbl tr:hover td{background:#f7f9fc}.gw-tbl tr.todo td.t a{font-weight:700}.gw-tbl tr.todo td.st{color:#e8590c;font-weight:700}
.gw-tbl td.empty{text-align:center;color:#888;padding:40px 0}
.gw-tbl .clip{color:#8a93a3}
.gw-tbl.sm{min-width:0;table-layout:auto}.gw-tbl.sm td{white-space:normal}
.gw-page{display:flex;justify-content:center;align-items:center;gap:3px;padding:14px}
.gw-page button{min-width:26px;height:26px;border:1px solid #d5d9e0;background:#fff;cursor:pointer;color:#333}
.gw-page button.on{border-color:#e8590c;color:#e8590c;font-weight:700}.gw-page button:disabled{color:#bbb;cursor:default}
.gw-page .of{margin-left:12px;color:#555}
.gw-note{padding:8px 14px;color:#666;font-size:11.5px;line-height:1.6}
/* 창 */
.gw-win{position:fixed;inset:0;z-index:100;background:rgba(40,44,52,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.gw-wbox{width:100%;background:#fff;border:1px solid #6b7280;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.gw-wtit{display:flex;justify-content:space-between;align-items:center;background:#4d4d52;color:#fff;padding:0 6px 0 14px;height:34px;font-size:13px}
.gw-wtit button{border:0;background:none;color:#fff;font-size:14px;cursor:pointer;width:30px;height:30px}
.gw-wbody{padding:0 16px 18px}
.gw-wtool{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid #d5d9e0;margin-bottom:12px;position:sticky;top:0;background:#fff;z-index:2}
.gw-dochd{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.gw-dochd .ttl small{color:#666}.gw-dochd h3{margin:2px 0 0;font-size:17px;font-weight:700;line-height:1.4}
.gw-appr{border-collapse:collapse;margin-left:auto}
.gw-appr th,.gw-appr td{border:1px solid #8b93a1;text-align:center;font-size:11.5px;padding:3px 6px;min-width:74px}
.gw-appr th{background:#f1f3f6;font-weight:700}
.gw-appr td.sg{height:46px;vertical-align:middle}.gw-appr td.sg img{max-height:38px;max-width:66px;mix-blend-mode:multiply}
.gw-appr td.sg em{font-style:normal;color:#888}.gw-appr td.sg.cur{background:#fff8e1}.gw-appr td.sg.cur em{color:#b26a00;font-weight:700}.gw-appr td.sg.rej em{color:#c0392b;font-weight:700}
.gw-appr td small{color:#666}.gw-appr td.dt{color:#555;font-size:11px}
.gw-form{width:100%;border-collapse:collapse;border-top:2px solid #6b7a99;table-layout:fixed}
.gw-form th{width:118px;background:#f3f5f8;border:1px solid #d5d9e0;padding:8px 10px;font-weight:700;text-align:left;vertical-align:middle;font-size:12px}
.gw-form th em{color:#c0392b;font-style:normal}.gw-form th small{font-weight:400;color:#666}
.gw-form td{border:1px solid #d5d9e0;padding:7px 10px;font-size:12.5px;line-height:1.7;vertical-align:middle}
.gw-form td.body{padding:14px 14px;line-height:1.9;min-height:160px;height:160px;vertical-align:top;font-size:13px}
.gw-form td small{color:#777;font-size:11.5px}
.gw-form input[type=text],.gw-form input:not([type]),.gw-form td>input#cpTitle{width:100%}
.gw-form textarea{width:100%;height:auto;padding:8px;line-height:1.7;resize:vertical;font-size:13px}
.gw-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:3px 0}.gw-row label{color:#555;font-weight:700}
.gw-chips{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}.gw-chips span{border:1px solid #c5cad3;background:#f6f7f9;padding:2px 8px;font-size:12px}.gw-chips small{color:#777}.gw-chips a{color:#c0392b;margin-left:3px}
.ck{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.gw-file{display:inline-flex;gap:4px;align-items:center;margin:0 12px 2px 0;color:#1d4f9f}.gw-file:hover{text-decoration:underline}.gw-file small{color:#777}
.gw-wbody h4{margin:16px 0 6px;font-size:12.5px;font-weight:700;padding-left:8px;border-left:3px solid #4a5fc1}
.gw-rep{display:flex;gap:5px;margin-top:6px}.gw-rep input{flex:1}
.gw-log{margin-top:14px;color:#666;font-size:11.5px;line-height:1.8}.gw-log summary{cursor:pointer}
.gw-stwrap{position:relative;border:1px solid #aab1be;overflow:hidden;background:#f3f5f9;line-height:0}.gw-stwrap canvas{width:100%;height:auto;cursor:crosshair;display:block}.gw-stwrap img{position:absolute;display:none;pointer-events:none;mix-blend-mode:multiply;opacity:.93}
.gw-sealimg{width:84px;height:84px;object-fit:contain;border:1px solid #d5d9e0;background:#fff}
@media(max-width:1180px){.gw-right{display:none}}
@media(max-width:820px){
  html,body{height:auto}.gw{height:auto}.gw-top{height:auto;flex-wrap:wrap}.gw-brand{width:100%;flex-direction:row;align-items:center;gap:8px;padding:9px 14px;justify-content:flex-start}
  .gw-nav button{width:72px;height:58px}.gw-user{width:100%;border-left:0;border-top:1px solid #e1e4e9;padding:7px 12px}.gw-user .nm{max-width:none;flex:1}
  .gw-body{flex-direction:column}.gw-left{width:100%;border-right:0;border-bottom:1px solid #d5d9e0;padding:10px 0;overflow:visible}
  .gw-tree{display:flex;flex-wrap:wrap;gap:2px 0;padding:0 8px}.gw-tree .grp{width:100%;padding:6px 6px 2px}.gw-tree a{padding:5px 9px;border:1px solid #d5d9e0;background:#fff;margin:2px}
  .gw-main{overflow:visible}.gw-form th{width:84px}.gw-win{padding:0}.gw-wbody{padding:0 10px 14px}.gw-appr{margin-left:0}.gw-b{height:32px}
}
</style>
</head>
<body>
<div class="gw-login" id="gwLogin">
  <div class="gw-lgbox">
    <h1>대한민국플라잉디스크연맹 인트라넷<small>중앙 사무국 · 시도연맹 · 구군연맹 임원 전용</small></h1>
    <form onsubmit="INTRA.login();return false" autocomplete="off">
      <label for="lgId">아이디 또는 이메일</label><input id="lgId" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="lgPw">비밀번호</label><input id="lgPw" type="password" autocomplete="current-password">
      <div class="gw-lgerr" id="lgErr"></div>
      <button type="submit" id="lgGo">로그인</button>
    </form>
    <div class="gw-lgfoot">홈페이지에 로그인되어 있어도 인트라넷은 아이디와 비밀번호를 다시 확인합니다.<br>30분 동안 사용하지 않으면 자동으로 잠깁니다.</div>
  </div>
</div>
<div class="gw" id="gwApp">
  <header class="gw-top">
    <div class="gw-brand">대한민국플라잉디스크연맹<small>인트라넷</small></div>
    <nav class="gw-nav" id="gwNav"></nav>
    <div class="gw-user" id="gwUser"></div>
  </header>
  <div class="gw-body">
    <aside class="gw-left" id="gwLeft"></aside>
    <main class="gw-main" id="gwMain"></main>
    <aside class="gw-right" id="gwRight"></aside>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="kfdf.js?v=20260914a"></script>
<script src="intranet.js?v=20260929b"></script>
</body>
</html>
