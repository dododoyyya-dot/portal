<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>대한민국플라잉디스크연맹 인트라넷</title>
<link rel="icon" href="kfdf_logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Dotum,"돋움",sans-serif;font-size:12px;color:#222;background:#e9ebef;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font-family:inherit;font-size:12px;color:#222}
a{cursor:pointer}
.gw-ic{vertical-align:-3px;flex:none}
/* 로그인 */
.gw-login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#23262c;padding:16px;overflow:auto}
.gw-lgbg{position:fixed;inset:-24px;background-size:cover;background-position:center;filter:blur(9px);opacity:0;transition:opacity .8s}.gw-lgbg.on{opacity:1}
.gw-lgdim{position:fixed;inset:0;background:rgba(18,20,24,.62);background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:4px 4px}
.gw-lgbox{position:relative;width:100%;max-width:456px;background:#fff;border-top:4px solid #00b4ea;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.gw-lglogo{display:flex;align-items:center;justify-content:center;gap:12px;padding:38px 24px 0}
.gw-lglogo img{width:64px;height:64px;object-fit:contain}
.gw-lglogo b{display:block;font-size:22px;font-weight:800;color:#111;letter-spacing:-1px;line-height:1.25}
.gw-lglogo small{display:block;font-size:11px;color:#444;letter-spacing:.2px}
.gw-lgsub{text-align:center;color:#00a5d8;font-size:12px;font-weight:700;letter-spacing:1.5px;margin:22px 0 4px}
.gw-lgbox form{padding:10px 56px 4px}
.gw-lgrow{display:flex;align-items:center;gap:8px;margin-top:14px}
.gw-lgrow label{flex:none;width:92px;font-size:13px;font-weight:700;color:#111;letter-spacing:1px;text-align:right}
.gw-lgrow input{flex:1;min-width:0;height:46px;border:1px solid #dcdfe4;background:#f3f3f3;padding:0 14px;font-size:14px;outline:none;border-radius:0}
.gw-lgrow input:focus{border-color:#00b4ea;background:#fff}
.gw-lgbox form button{width:100%;height:46px;margin-top:8px;border:0;background:#00b4ea;color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:2px}
.gw-lgbox form button:hover{background:#00a2d3}.gw-lgbox form button:disabled{opacity:.6}
.gw-lgerr{min-height:18px;margin-top:10px;color:#c0392b;font-size:12px;text-align:center}
.gw-lgnote{padding:14px 30px 18px;text-align:center;font-size:11.5px;color:#555;line-height:1.75}.gw-lgnote b{color:#111}
.gw-lgfoot{display:grid;grid-template-columns:repeat(4,1fr);background:#e6e7ea}
.gw-lgfoot a{display:flex;align-items:center;justify-content:center;height:58px;font-size:12px;color:#444;text-decoration:none;border-left:1px solid #fff;text-align:center;padding:0 4px}
.gw-lgfoot a:first-child{border-left:0}.gw-lgfoot a:hover{background:#d9dbe0;color:#111}
@media(max-width:520px){.gw-lgbox form{padding:10px 22px 4px}.gw-lgrow label{width:70px;letter-spacing:0}.gw-lglogo b{font-size:18px}.gw-lglogo img{width:52px;height:52px}}
/* 틀 */
.gw{display:none;flex-direction:column;height:100%;min-width:0}
.gw-top{flex:none;display:flex;align-items:stretch;height:80px;background:#fff;border-bottom:2px solid #3d8bd9}
.gw-brand{flex:none;width:214px;background:#4d4d52;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 14px;font-size:15px;font-weight:700;letter-spacing:-.5px;line-height:1.35}
.gw-brand{cursor:pointer}.gw-brand:hover{background:#3f3f44}
/* 첫 화면 */
.gw-alarm{margin:0 0 0;background:#42a0dc;color:#fff;padding-bottom:10px}
.gw-alarm h3{margin:0;padding:14px 20px;background:#f4f5f7;color:#222;font-size:14px;font-weight:700;letter-spacing:2px;border-bottom:1px solid #d5d9e0}
.gw-alarm .ag{display:flex;padding:12px 16px 10px 20px;border-bottom:1px solid rgba(255,255,255,.28);margin:0 4px}
.gw-alarm .ag:last-child{border-bottom:0}
.gw-alarm .ag>b{flex:none;width:52px;font-size:12.5px;line-height:26px}
.gw-alarm .ag>div{flex:1;min-width:0}
.gw-alarm .ag a{display:flex;justify-content:space-between;align-items:center;height:26px;font-size:12px;color:#fff;padding:0 4px}
.gw-alarm .ag a:hover{background:rgba(255,255,255,.16)}
.gw-alarm .ag em{font-style:normal;font-weight:700}
.gw-home{padding:14px 16px 24px;background:#fff;min-height:100%}
.gw-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:60px;padding:10px 22px;color:#fff;background:linear-gradient(115deg,#1466c7 0,#1f8de0 38%,#24b3e8 60%,#f6a21c 60.2%,#f6a21c 64%,#1f8de0 64.2%,#0f58b3 100%)}
.gw-banner b{font-size:16px;letter-spacing:-.3px}.gw-banner span{font-size:12px;opacity:.95}.gw-banner select{height:26px;border:0;padding:0 6px}
.gw-banner .gw-say{color:#fff;font-weight:700;margin-left:auto}
.gw-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.gw-card{border:1px solid #d9dde4;background:#fff;min-height:250px;border-top:2px solid #e2574c;min-width:0}
.gw-card.c2{border-top-color:#2e9e4f}.gw-card.c3{border-top-color:#3d8bd9}.gw-card.c4{border-top-color:#b06ccf}
.gw-card h3{display:flex;align-items:center;gap:7px;margin:0 10px;padding:16px 10px 12px;font-size:13px;font-weight:700;letter-spacing:1.5px;border-bottom:1px solid #eceef2}
.gw-card h3 svg{color:#e2574c}.gw-card.c2 h3 svg{color:#2e9e4f}.gw-card.c3 h3 svg{color:#3d8bd9}.gw-card.c4 h3 svg{color:#b06ccf}
.gw-card h3 button{margin-left:auto;width:22px;height:22px;border:1px solid #c5cad3;background:#fff;color:#8a93a3;cursor:pointer;line-height:1;padding:0}
.gw-card .hl{padding:8px 14px 12px}
.gw-card .hr{display:flex;gap:10px;align-items:center;height:28px;font-size:12px;color:#222}
.gw-card .hr:hover .t{color:#1d4f9f;text-decoration:underline}
.gw-card .hr .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.gw-card .hr .w{flex:none;width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333}
.gw-card .hr .d{flex:none;color:#8a93a3;font-size:11.5px}
.gw-card .nw{display:inline-block;width:14px;height:14px;line-height:14px;margin-right:5px;background:#e8590c;color:#fff;font-style:normal;font-size:9.5px;text-align:center;font-weight:700;vertical-align:1px}
.gw-card .he{text-align:center;color:#666;padding:44px 0;font-size:12px}
.gw-tiles{display:flex;gap:10px;padding:12px 14px 14px;flex-wrap:wrap}
.gw-tiles .tl{display:grid;grid-template-columns:110px 110px;gap:10px;flex:none}
.gw-tiles .tl button{height:92px;border:0;border-bottom:4px solid #2f86c6;background:#42a0dc;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.gw-tiles .tl button:hover{filter:brightness(1.06)}
.gw-tiles .tl button.y{background:#f6c443;border:3px solid #e9a900;color:#222}
.gw-tiles .lk{flex:1;min-width:150px}
.gw-tiles .lk a{display:flex;align-items:center;gap:6px;height:39px;border-top:1px solid #e3e6eb;font-size:12px;color:#222;padding:0 8px}
.gw-tiles .lk a:last-child{border-bottom:1px solid #e3e6eb}.gw-tiles .lk a:hover{background:#f5f7fa}
.gw-tiles .lk em{margin-left:auto;font-style:normal;font-weight:700;color:#e8590c}
.gw-tiles .lk svg{color:#555}
@media(max-width:980px){.gw-grid{grid-template-columns:1fr}.gw-card{min-height:0}}
@media(max-width:820px){.gw-alarm .ag{display:block}.gw-alarm .ag>div{display:flex;flex-wrap:wrap;gap:0 14px}.gw-alarm .ag a{gap:6px}.gw-card .hr .w{display:none}.gw-tiles .tl{grid-template-columns:1fr 1fr;flex:1;min-width:220px}}
.gw-brand small{font-size:11px;font-weight:400;color:#c9cbd1;letter-spacing:0}
.gw-nav{flex:1;display:flex;min-width:0;overflow-x:auto}
.gw-nav .ni{position:relative;display:inline-flex}
.gw-nav .ni em{position:absolute;right:-13px;top:-6px;min-width:16px;height:16px;border-radius:8px;background:#f07c1f;color:#fff;font-style:normal;font-size:10px;font-weight:700;line-height:16px;text-align:center;padding:0 3px}
/* 공문 용지 · 결재정보 창 */
.gw-cpsum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.gw-cpsum a{border:1px solid #d5d9e0;background:#f6f7f9;padding:5px 10px;font-size:12px;color:#333}.gw-cpsum a:hover{border-color:#4a5fc1;background:#eef2f8}.gw-cpsum b{color:#1d4f9f;margin-right:4px}
.gw-cpwrap{display:flex;gap:12px;align-items:flex-start;background:#eceef2;padding:18px 14px;border:1px solid #d5d9e0}
.gw-paper{flex:1;min-width:0;background:#fff;border:1px solid #c9ced7;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:34px 46px 40px;font-family:"Batang","바탕","Malgun Gothic",serif}
.gw-paper.view{margin:14px 0 4px;border-color:#d5d9e0}
.gw-paper .pm{text-align:center;font-size:14px;letter-spacing:1px;color:#222;border:1px dashed #e1a3a3;border-bottom:0;padding:5px}.gw-paper.view .pm{border-color:transparent}
.gw-paper .ph{display:grid;grid-template-columns:84px 1fr 84px;align-items:center;border:1px dashed #e1a3a3;border-bottom:0;padding:10px 8px}
.gw-paper.view .ph,.gw-paper.view .pk th,.gw-paper.view .pk td{border-color:transparent}
.gw-paper .ph img{width:64px;height:64px;object-fit:contain;justify-self:center}
.gw-paper .ph b{text-align:center;font-size:25px;font-weight:700;letter-spacing:9px;color:#111}
.gw-paper .pk{width:100%;border-collapse:collapse;border-bottom:2px solid #111}
.gw-paper .pk th{width:88px;border:1px dashed #e1a3a3;font-size:17px;font-weight:400;padding:7px 6px;text-align:center;white-space:nowrap}
.gw-paper .pk td{border:1px dashed #e1a3a3;font-size:16px;padding:5px 8px;line-height:1.5}
.gw-paper .pk td a{display:block;color:#111;min-height:24px}.gw-paper .pk td a:hover{background:#f2f6fd}
.gw-paper .pk input{width:100%;border:0;outline:none;font-family:inherit;font-size:16px;height:28px;background:transparent}
.gw-paper textarea{display:block;width:100%;min-height:420px;margin-top:16px;border:0;outline:none;resize:vertical;font-family:inherit;font-size:15.5px;line-height:1.9;color:#111}
.gw-paper .pb{min-height:200px;margin-top:16px;font-size:15.5px;line-height:1.9;color:#111}
.gw-paper .pf{text-align:center;font-size:22px;font-weight:700;letter-spacing:5px;margin-top:34px;color:#111}
.gw-cpatt{flex:none;width:176px;background:#dcecf8;border:1px solid #b9d3e8;padding:10px;min-height:200px}
.gw-cpatt b{display:block;font-size:12px;margin-bottom:8px;color:#1d4f9f}.gw-cpatt .gw-chips{flex-direction:column}.gw-cpatt .gw-chips span{background:#fff;word-break:break-all}.gw-cpatt small{display:block;margin-top:8px;color:#557;line-height:1.6}
.gw-tabs{display:flex;gap:2px;border-bottom:1px solid #9aa3b2;margin-top:12px}
.gw-tabs a{padding:7px 16px;border:1px solid #c5cad3;border-bottom:0;background:#f1f3f6;font-size:12.5px;color:#333}
.gw-tabs a.on{background:#fff;font-weight:700;border-color:#9aa3b2;border-top:2px solid #f0962e;margin-bottom:-1px}
.gw-tabs.sm{margin:0;border-bottom:1px solid #c5cad3}.gw-tabs.sm a{padding:5px 10px;font-size:12px}
.gw-tabp{border:1px solid #9aa3b2;border-top:0;padding:14px;min-height:330px;background:#fbfbfc}
.gw-ci3{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1.15fr);gap:10px;align-items:start}
.gw-ci3 .tr{border:1px solid #aab1be;background:#fff}.gw-ci3 .hd{padding:6px 10px;background:#f1f3f6;border-bottom:1px solid #c5cad3;font-weight:700}
.gw-ci3 .sc{height:270px;overflow:auto;padding:4px 0}
.gw-ci3 .tg{padding:5px 8px;font-weight:700;color:#333;display:flex;gap:5px;align-items:center}.gw-ci3 .tg.l2{padding-left:22px}.gw-ci3 .tg svg{color:#3d8bd9}
.gw-ci3 .tm{display:flex;gap:5px;align-items:center;padding:4px 8px 4px 26px;font-size:12px;color:#222}.gw-ci3 .tm.l2{padding-left:40px}
.gw-ci3 .tm:hover{background:#eef2f8}.gw-ci3 .tm.on{background:#cfe0f7;font-weight:700}.gw-ci3 .tm svg{color:#c98a2b}
.gw-ci3 .md{display:flex;flex-direction:column;gap:8px;padding-top:70px;align-items:stretch}.gw-ci3 .md label{font-weight:700}.gw-ci3 .md select{height:26px}.gw-ci3 .md small{color:#c0392b;line-height:1.5}
.gw-ci3 .rt .gw-tbl{border:1px solid #aab1be;background:#fff}.gw-ci3 .rt tr.on td{background:#cfe0f7}.gw-ci3 .rt tbody tr{cursor:pointer}
.gw-cifoot{display:flex;justify-content:center;gap:10px;padding:14px 0 2px}.gw-cifoot .gw-b{min-width:96px;justify-content:center;height:30px}
@media(max-width:820px){.gw-cpwrap{flex-direction:column;padding:10px 6px}.gw-cpatt{width:100%;min-height:0}.gw-paper{padding:18px 14px 24px}.gw-paper .ph b{font-size:18px;letter-spacing:3px}.gw-paper .ph{grid-template-columns:56px 1fr 10px}.gw-paper .pk th{width:62px;font-size:14px}.gw-ci3{grid-template-columns:1fr}.gw-ci3 .md{padding-top:0;flex-direction:row;flex-wrap:wrap}.gw-ci3 .sc{height:180px}}
.gw-hint{background:#fff8e1;border:1px solid #f0d68a;padding:8px 12px;margin:0 0 12px;color:#6b4a00;line-height:1.6}
.gw-poll label{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;cursor:pointer}
.gw-poll label span{flex:none;width:38%;min-width:120px}
.gw-poll i{flex:1;height:10px;background:#eef0f3;display:block}.gw-poll i b{display:block;height:100%;background:#42a0dc}
.gw-poll em{font-style:normal;font-weight:700;width:28px;text-align:right}
.gw-nav button{flex:none;width:80px;border:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:700;color:#333;cursor:pointer;border-bottom:3px solid transparent}
.gw-nav button svg{color:#3b6cc0}
.gw-nav button:hover{background:#f5f7fa}
.gw-nav button.on{background:#eef2f8;border-bottom-color:#3d8bd9}
.gw-user{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid #e1e4e9;font-size:12px}
.gw-user .av{width:34px;height:34px;border-radius:50%;background:#dfe2e7;color:#9aa1ad;display:flex;align-items:center;justify-content:center}
.gw-user .nm{display:flex;flex-direction:column;line-height:1.5;max-width:210px}
.gw-user .nm b{color:#2a62b8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-user .nm i{font-style:normal;color:#333;white-space:nowrap}
.gw-user button{border:1px solid #c5cad3;background:#fff;height:26px;padding:0 8px;cursor:pointer;color:#555}
.gw-body{flex:1;display:flex;min-height:0}
.gw-left{flex:none;width:214px;background:#f4f5f7;border-right:1px solid #d5d9e0;overflow-y:auto;padding:14px 0 20px}
.gw-new{position:relative;display:flex;margin:0 16px}
.gw-new .main{flex:1;height:36px;border:0;background:#4a5fc1;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.gw-new .dd{width:26px;border:0;border-left:1px solid #6f80d4;background:#4a5fc1;color:#fff;cursor:pointer}
.gw-new .menu{display:none;position:absolute;top:36px;left:0;right:0;background:#fff;border:1px solid #aab1be;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.gw-new .menu a{display:block;padding:8px 12px;font-size:12px}.gw-new .menu a:hover{background:#eef2f8}
.gw-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:14px 8px 10px;padding-bottom:12px;border-bottom:1px solid #d5d9e0}
.gw-quick button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.gw-quick .c{position:relative;width:34px;height:34px;border-radius:50%;background:#d3d7de;color:#fff;display:flex;align-items:center;justify-content:center}
.gw-quick .c.on{background:#5b8bd0}
.gw-quick em{position:absolute;right:-7px;bottom:-3px;min-width:17px;height:17px;border-radius:9px;background:#f07c1f;color:#fff;font-style:normal;font-size:10px;font-weight:700;line-height:17px;text-align:center;padding:0 3px}
.gw-quick i{font-style:normal;font-size:11px;color:#333;letter-spacing:-.5px;white-space:nowrap}
.gw-tree{padding:0 10px}
.gw-tree .grp{font-size:12px;font-weight:700;color:#333;padding:8px 6px 4px;display:flex;align-items:center;gap:5px}
.gw-tree .grp svg,.gw-tree a svg{color:#9aa3b2}
.gw-tree a{display:flex;align-items:center;gap:5px;padding:4px 6px 4px 24px;font-size:12px;color:#333}
.gw-tree a:hover{background:#e6e9ee}.gw-tree a.on{background:#dbe4f3;font-weight:700;color:#1d4f9f}
.gw-tree a b{font-weight:700;color:#555;margin-left:2px}.gw-tree a b.hot{color:#e8590c}
.gw-main{flex:1;min-width:0;background:#fff;overflow:auto;padding:0 0 20px}
.gw-right{flex:none;width:226px;background:#f4f5f7;border-left:1px solid #d5d9e0;overflow-y:auto;padding:12px 10px}
.gw-right .box{background:#fff;border:1px solid #d5d9e0;margin-bottom:12px}
.gw-right h3{margin:0;padding:9px 10px;font-size:12.5px;font-weight:700;border-bottom:1px solid #e3e6eb}
.gw-right .box>a{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #eef0f3;color:#333;text-decoration:none;font-size:12px}
.gw-right .box>a:hover{background:#f5f7fa}.gw-right .box>a span{color:#777}
.gw-right .org{padding:8px 10px;font-weight:700;color:#2a62b8}
.gw-right .mem{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid #eef0f3;line-height:1.6}
.gw-right .mem .av{width:30px;height:30px;border-radius:50%;background:#dfe2e7;color:#9aa1ad;display:flex;align-items:center;justify-content:center;flex:none}
/* 목록 */
.gw-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 14px 10px;border-bottom:1px solid #d5d9e0}
.gw-bar h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:1px}.gw-bar h2 span{letter-spacing:0;font-weight:700}
.sp{flex:1}
.gw-bar label,.gw-search label{font-size:12px;color:#333;margin-left:6px;font-weight:700}
.gw-bar select,.gw-search input,.gw-tool select,.gw-form input,.gw-form select,.gw-form textarea,.gw-rep input{height:26px;border:1px solid #bfc5cf;background:#fff;padding:0 6px;border-radius:0;outline:none;max-width:100%}
.gw-search{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #e3e6eb}
.gw-search input#gwQ{width:140px}
