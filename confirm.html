<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>강습 확인 · 담당교사 | 대한민국플라잉디스크연맹</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--red:#C41E2F;--blue:#153A77;--line:#e3e6ea;--gray:#6b7280;--black:#17171a}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',sans-serif;background:#eef1f5;color:var(--black);-webkit-text-size-adjust:100%}
  .top{background:var(--blue);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px}
  .top img{width:34px;height:34px;object-fit:contain}
  .top b{font-size:15px;font-weight:800;line-height:1.3}
  .top span{display:block;font-size:11.5px;color:#c3d0e6;font-weight:600}
  .wrap{max-width:540px;margin:0 auto;padding:20px 16px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(17,17,20,.05);margin-bottom:16px}
  h1{font-size:20px;font-weight:900;margin:0 0 4px}
  .lead{font-size:13.5px;color:var(--gray);margin:0 0 16px;line-height:1.6}
  .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--gray);font-weight:700;flex:0 0 88px}
  .row .v{font-weight:700;text-align:right;flex:1;word-break:keep-all}
  .big{font-size:17px;color:var(--blue);font-weight:900}
  table.sess{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:13.5px}
  table.sess th{background:#f5f8fc;color:var(--gray);font-weight:700;padding:8px 6px;font-size:12px}
  table.sess td{border-top:1px solid var(--line);padding:9px 6px;text-align:center}
  table.sess td.l{text-align:left}
  .ok-badge{color:#0f766e;font-weight:800}
  .wait-badge{color:#b8860b;font-weight:800}
  label.fl{display:block;font-size:13.5px;font-weight:800;margin:2px 0 7px}
  input[type=text]{width:100%;padding:13px 14px;border:1.6px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--blue)}
  .sigwrap{margin-top:16px}
  .sigbox{position:relative;border:1.6px dashed #b9c2d0;border-radius:12px;background:#fbfcfe;touch-action:none}
  #sig{display:block;width:100%;height:170px;border-radius:12px}
  .sighint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#aab3c2;font-size:13.5px;font-weight:700;pointer-events:none}
  .sigtools{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .clr{background:none;border:none;color:var(--red);font-weight:800;font-size:13px;cursor:pointer;padding:4px}
  .btn{width:100%;margin-top:20px;background:var(--red);color:#fff;border:none;padding:16px;border-radius:12px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.55}
  .msg{font-size:13.5px;font-weight:700;margin-top:12px;min-height:18px;text-align:center}
  .msg.err{color:var(--red)} .msg.ok{color:#0f766e}
  .state{text-align:center;padding:30px 10px;color:var(--gray);font-size:14.5px}
  .done{text-align:center;padding:8px 0}
  .done .chk{font-size:52px}
  .done h2{font-size:20px;margin:6px 0 4px;color:#0f766e}
  .note{background:#f5f8fc;border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--gray);line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<div class="top">
  <img src="kfdf_logo.png" alt="로고">
  <div><b>강습 실시 확인</b><span>대한민국플라잉디스크연맹 · 담당교사 확인</span></div>
</div>
<div class="wrap">
  <div class="card" id="stage">
    <div class="state" id="loading">불러오는 중…</div>
  </div>
  <div class="note">
    본 확인은 해당 강습이 실제 귀교에서 진행되었음을 담당교사께서 확인하는 절차입니다.
    입력하신 성명·서명·시각은 사업 실적 증빙 목적으로만 보관되며, 확인 후에는 수정할 수 없습니다.
    문의: 사무국 031-984-3248
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="kfdf.js?v=20260821"></script>
<script>
KFDF.initApp();
const DB=firebase.firestore();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function qs(k){return new URLSearchParams(location.search).get(k)}

let ALLLOGS=[], PENDING=[], INFO={school:'',name:'',type:''}, SIGGED=false;

async function boot(){
  const stage=document.getElementById('stage');
  if(qs('goods')){return bootGoods(qs('goods').trim());}
  // id(단건) 또는 ids(일괄, 쉼표) 지원
  let ids=[];
  if(qs('ids'))ids=qs('ids').split(',').map(s=>s.trim()).filter(Boolean);
  else if(qs('id'))ids=[qs('id').trim()];
  if(!ids.length){stage.innerHTML='<div class="state">잘못된 접근입니다. 강사에게 받은 확인 링크/QR로 접속해주세요.</div>';return}
  try{
    const snaps=await Promise.all(ids.map(i=>DB.collection('sessionLogs').doc(i).get()));
    ALLLOGS=snaps.filter(s=>s.exists).map(s=>Object.assign({_id:s.id},s.data()));
    if(!ALLLOGS.length){stage.innerHTML='<div class="state">확인 대상을 찾을 수 없습니다. 링크를 다시 확인해주세요.</div>';return}
    ALLLOGS.sort((a,b)=>(a.session||0)-(b.session||0));
    INFO={school:ALLLOGS[0].school||'',name:ALLLOGS[0].name||'',type:ALLLOGS[0].type||''};
    PENDING=ALLLOGS.filter(l=>!l.teacherConfirm);
    if(!PENDING.length){renderDone();return}
    renderForm();
  }catch(e){stage.innerHTML='<div class="state">불러오기 실패: '+esc(e.message)+'</div>'}
}

function sessTable(markConfirmTarget){
  let h='<table class="sess"><tr><th>회차</th><th>일자</th><th>인원</th><th>상태</th></tr>';
  ALLLOGS.forEach(l=>{
    const done=!!l.teacherConfirm;
    h+='<tr><td><b>'+esc(l.session)+'</b></td><td>'+esc(l.date)+'</td><td>'+(l.count?esc(l.count)+'명':'-')+'</td>'
      +'<td>'+(done?'<span class="ok-badge">✓ 확인됨</span>':(markConfirmTarget?'<span class="wait-badge">확인 대상</span>':'-'))+'</td></tr>';
  });
  return h+'</table>';
}

function renderForm(){
  const multi=ALLLOGS.length>1;
  document.getElementById('stage').innerHTML=
    '<h1>강습 실시 확인</h1>'
    +'<p class="lead">아래 강습이 실제로 진행되었음을 확인하시면, 성명과 서명을 한 번 남겨주세요. '
    +(multi?'미확인 <b>'+PENDING.length+'개 회차</b>가 한 번에 확인됩니다.':'')+'</p>'
    +'<div class="row"><span class="k">학교</span><span class="v big">'+esc(INFO.school)+'</span></div>'
    +(INFO.type?'<div class="row"><span class="k">유형</span><span class="v">'+esc(INFO.type)+'</span></div>':'')
    +'<div class="row"><span class="k">담당 강사</span><span class="v">'+esc(INFO.name)+'</span></div>'
    +'<div style="margin-top:12px"><label class="fl">'+(multi?'확인 대상 회차 ('+PENDING.length+'개)':'회차')+'</label>'+sessTable(true)+'</div>'
    +'<div style="margin-top:18px"><label class="fl">담당교사 성명</label>'
    +'<input type="text" id="tname" placeholder="예: 홍길동" autocomplete="name" maxlength="20"></div>'
    +'<div class="sigwrap"><label class="fl">서명 <span style="font-weight:600;color:var(--gray)">(손가락/펜으로 서명해주세요)</span></label>'
    +'<div class="sigbox"><canvas id="sig"></canvas><div class="sighint" id="sighint">여기에 서명</div></div>'
    +'<div class="sigtools"><span style="font-size:12px;color:var(--gray)">확인 후에는 수정할 수 없습니다</span><button class="clr" onclick="clearSig()">✕ 다시</button></div></div>'
    +'<button class="btn" id="okbtn" onclick="submitConfirm()">'+(multi?PENDING.length+'개 회차 확인하고 서명 제출':'확인하고 서명 제출')+'</button>'
    +'<div class="msg" id="msg"></div>';
  initSig();
}

function renderDone(tc){
  const c=tc||(ALLLOGS.find(l=>l.teacherConfirm)||{}).teacherConfirm||{};
  const cN=ALLLOGS.filter(l=>l.teacherConfirm).length;
  document.getElementById('stage').innerHTML=
    '<div class="done"><div class="chk">✅</div><h2>확인 완료</h2>'
    +'<div style="font-size:14px;color:#555;margin-bottom:12px">'+esc(INFO.school)+' · 총 '+cN+'개 회차 담당교사 확인이 기록되었습니다.</div></div>'
    +sessTable(false)
    +'<div class="row" style="margin-top:8px"><span class="k">확인 교사</span><span class="v">'+esc(c.name||'')+'</span></div>'
    +(c.at?'<div class="row"><span class="k">확인 시각</span><span class="v" style="font-weight:600;color:#777">'+esc(String(c.at).replace('T',' ').slice(0,16))+'</span></div>':'')
    +(c.sign?'<div style="margin-top:12px;text-align:center"><img src="'+c.sign+'" alt="서명" style="max-width:200px;border:1px solid #eee;border-radius:8px"></div>':'');
}

let ctx,canvas,drawing=false,last=null;
function initSig(){
  canvas=document.getElementById('sig');
  const r=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr;canvas.height=170*dpr;
  ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#12233f';
  const pos=e=>{const b=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-b.left,y:t.clientY-b.top}};
  const start=e=>{e.preventDefault();drawing=true;last=pos(e);if(!SIGGED){SIGGED=true;document.getElementById('sighint').style.display='none'}};
  const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};
  const end=()=>{drawing=false};
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
}
function clearSig(){if(ctx){ctx.clearRect(0,0,canvas.width,canvas.height);SIGGED=false;document.getElementById('sighint').style.display='block'}}
function exportSign(){
  let sign='';
  try{
    const out=document.createElement('canvas');out.width=360;out.height=120;
    out.getContext('2d').drawImage(canvas,0,0,out.width,out.height);
    sign=out.toDataURL('image/png');
    if(sign.length>190000)sign=out.toDataURL('image/jpeg',0.7);
  }catch(e){sign=''}
  return sign;
}

// ── 용품(물품) 배송지 입력 + 수령 확인 (2단계) ──
// [배송지 기능] STEP1: 배송지 입력(주소검색·수령인·연락처) → STEP2: 용품 도착 후 수령 확인(성명·사진 1장 필수·서명)
let GOODS=null,GOODS_PHOTO='';
async function bootGoods(id){
  const stage=document.getElementById('stage');
  try{
    const doc=await DB.collection('goodsConfirms').doc(id).get();
    if(!doc.exists){stage.innerHTML='<div class="state">확인 대상을 찾을 수 없습니다. 링크를 다시 확인해주세요.</div>';return}
    GOODS=Object.assign({_id:id},doc.data());
    renderGoodsFlow();
  }catch(e){stage.innerHTML='<div class="state">불러오기 실패: '+esc(e.message)+'</div>'}
}
function renderGoodsFlow(){
  if(GOODS.teacherConfirm)renderGoodsDone();
  else if(!GOODS.delivery)renderDeliveryForm();
  else renderGoodsForm();
}
// 단계 표시줄 — 처음 보는 분도 흐름을 한눈에
function gStepBar(cur){
  const st=(n,label,done)=>'<div style="flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:12.5px;font-weight:800;'
    +(done?'background:#e6f5f0;color:#0f766e;border:1.5px solid #bfe0d5':(n===cur?'background:var(--blue);color:#fff':'background:#f1f4f8;color:#8a919d'))+'">'
    +(done?'✓ ':'')+label+'</div>';
  return '<div style="display:flex;gap:7px;margin-bottom:14px">'
    +st(1,'① 배송지 입력',!!GOODS.delivery)
    +st(2,'② 수령 확인 (도착 후)',!!GOODS.teacherConfirm)+'</div>';
}
// ── STEP 1: 배송지 입력 ──
function renderDeliveryForm(){
  const d=GOODS.delivery||{};
  document.getElementById('stage').innerHTML=
    gStepBar(1)
    +'<h1>🚚 강습용품 배송지 입력</h1>'
    +'<p class="lead">안녕하세요, 선생님! <b>'+esc(GOODS.school)+'</b> 앞으로 강습용품 세트를 보내드립니다.<br>아래 배송지를 입력해 주시면 준비되는 대로 발송됩니다. <b>용품이 도착하면 이 링크를 다시 열어 ② 수령 확인</b>을 해주시면 됩니다. (1~2분이면 끝나요)</p>'
    +'<div class="row"><span class="k">수령 품목</span><span class="v" style="font-weight:600">'+esc(GOODS.items||'강습 용품 세트')+'</span></div>'
    +'<div style="margin-top:16px"><label class="fl">학교 주소 (배송지)</label>'
    +'<div style="display:flex;gap:8px"><input type="text" id="dZip" placeholder="우편번호" readonly style="flex:0 0 110px;background:#f7f9fc">'
    +'<button type="button" class="btn" style="width:auto;margin:0;padding:12px 18px;font-size:14px;background:var(--blue)" onclick="openPostcode()">🔍 주소 검색</button></div>'
    +'<div id="pcWrap" style="display:none;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;position:relative;height:440px"><button type="button" onclick="closePostcode()" style="position:absolute;top:6px;right:6px;z-index:5;width:30px;height:30px;border:none;border-radius:50%;background:#333;color:#fff;font-size:15px;font-weight:800;cursor:pointer">×</button><div id="pcBox" style="width:100%;height:100%"></div></div>'
    +'<input type="text" id="dAddr" placeholder="[주소 검색]을 눌러 선택해주세요" readonly style="margin-top:8px;background:#f7f9fc">'
    +'<input type="text" id="dAddr2" placeholder="상세 주소 (예: 본관 교무실 / 체육관 앞)" style="margin-top:8px"></div>'
    +'<div style="margin-top:14px"><label class="fl">수령 담당자 성명</label><input type="text" id="dName" maxlength="20" placeholder="예: '+esc(GOODS.school?'홍길동':'홍길동')+'" value="'+esc(d.receiver||'')+'"></div>'
    +'<div style="margin-top:14px"><label class="fl">담당자 연락처</label><input type="text" id="dPhone" inputmode="tel" placeholder="예: 010-1234-5678" value="'+esc(d.phone||'')+'"></div>'
    +'<div style="margin-top:14px"><label class="fl">배송 메모 <span style="font-weight:600;color:var(--gray)">(선택)</span></label><input type="text" id="dNote" maxlength="60" placeholder="예: 부재 시 경비실에 맡겨주세요" value="'+esc(d.note||'')+'"></div>'
    +'<button class="btn" id="okbtn" onclick="submitDelivery()">배송지 저장</button>'
    +'<div class="msg" id="msg"></div>'
    +'<div style="font-size:12px;color:#8a919d;margin-top:12px;line-height:1.6">· 입력하신 정보는 용품 배송 목적으로만 사용됩니다.<br>· 저장 후에도 발송 전까지 이 링크에서 수정할 수 있습니다.</div>';
  if(d.zip)document.getElementById('dZip').value=d.zip;
  if(d.addr)document.getElementById('dAddr').value=d.addr;
  if(d.addr2)document.getElementById('dAddr2').value=d.addr2;
}
// 다음(카카오) 우편번호 검색 — 필요할 때만 로드, 실패 시 직접 입력으로 전환
function closePostcode(){const w=document.getElementById('pcWrap');if(w){w.style.display='none';document.getElementById('pcBox').innerHTML=''}}
function openPostcode(){
  const go=()=>{
    const wrap=document.getElementById('pcWrap'),box=document.getElementById('pcBox');
    if(!wrap||!box)return;
    box.innerHTML='';wrap.style.display='block';
    new daum.Postcode({width:'100%',height:'100%',oncomplete:function(data){
      document.getElementById('dZip').value=data.zonecode||'';
      document.getElementById('dAddr').value=(data.roadAddress||data.jibunAddress||'');
      closePostcode();
      const a2=document.getElementById('dAddr2');if(a2)a2.focus();
    }}).embed(box);
    try{wrap.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){}
  };
  if(window.daum&&window.daum.Postcode)return go();
  const s=document.createElement('script');
  s.src='https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
  s.onload=go;
  s.onerror=function(){
    document.getElementById('dZip').removeAttribute('readonly');
    document.getElementById('dAddr').removeAttribute('readonly');
    document.getElementById('dZip').style.background='#fff';
    document.getElementById('dAddr').style.background='#fff';
    alert('주소 검색을 불러오지 못했습니다. 우편번호와 주소를 직접 입력해주세요.');
  };
  document.head.appendChild(s);
}
async function submitDelivery(){
  const msg=document.getElementById('msg');
  const v=id=>(document.getElementById(id).value||'').trim();
  if(!v('dAddr')){msg.textContent='[주소 검색]으로 학교 주소를 선택해주세요';msg.className='msg err';return}
  if(!v('dName')){msg.textContent='수령 담당자 성명을 입력해주세요';msg.className='msg err';return}
  if(v('dPhone').replace(/\D/g,'').length<9){msg.textContent='담당자 연락처를 입력해주세요';msg.className='msg err';return}
  const btn=document.getElementById('okbtn');btn.disabled=true;msg.textContent='저장 중…';msg.className='msg';
  const dv={zip:v('dZip'),addr:v('dAddr'),addr2:v('dAddr2'),receiver:v('dName'),phone:v('dPhone'),note:v('dNote'),at:new Date().toISOString()};
  try{
    await DB.collection('goodsConfirms').doc(GOODS._id).update({delivery:dv});
    GOODS.delivery=dv;
    renderGoodsFlow();
    setTimeout(()=>{try{document.getElementById('msg2').textContent='✓ 배송지가 저장되었습니다. 용품이 도착하면 아래에서 수령 확인을 해주세요!';document.getElementById('msg2').className='msg ok'}catch(e){}},50);
  }catch(e){btn.disabled=false;msg.textContent='저장 실패: '+e.message;msg.className='msg err'}
}
// ── STEP 2: 수령 확인 (성명·사진 필수·서명) ──
function renderGoodsForm(){
  const d=GOODS.delivery||{};
  GOODS_PHOTO='';
  document.getElementById('stage').innerHTML=
    gStepBar(2)
    +'<h1>📦 용품 수령 확인</h1>'
    +'<p class="lead"><b>용품이 학교에 도착하셨나요?</b> 아래 순서대로 하시면 됩니다:<br>1️⃣ 받으신 용품 사진 1장 촬영·첨부 → 2️⃣ 성명 입력 → 3️⃣ 서명 → 제출 (끝!)</p>'
    +'<div class="row"><span class="k">학교</span><span class="v big">'+esc(GOODS.school)+'</span></div>'
    +'<div class="row"><span class="k">수령 품목</span><span class="v" style="font-weight:600">'+esc(GOODS.items||'강습 용품 세트')+'</span></div>'
    +'<div class="row"><span class="k">배송지</span><span class="v" style="font-weight:600">'+esc((d.addr||'')+' '+(d.addr2||''))+'<br><span style="color:#8a919d;font-weight:600;font-size:12.5px">'+esc(d.receiver||'')+' · '+esc(d.phone||'')+'</span></span></div>'
    +'<div style="text-align:right;margin-top:6px"><button class="clr" onclick="renderDeliveryForm()" style="font-size:12.5px">✏️ 아직 도착 전인가요? 배송지 수정하기</button></div>'
    +'<div class="msg" id="msg2"></div>'
    +'<div style="margin-top:12px;padding:14px;border:1.6px dashed #b9c2d0;border-radius:12px;background:#fbfcfe">'
    +'<label class="fl">📷 받으신 용품 사진 <span style="color:var(--red)">*필수 1장</span> <span style="font-weight:600;color:var(--gray);font-size:12px">— 용품(디스크·교재 등)이 보이게 찍어주세요. 체육회 보고 증빙으로 사용됩니다.</span></label>'
    +'<input type="file" id="gPhoto" accept="image/*" capture="environment" style="font-size:14px" onchange="pickGoodsPhoto(this)">'
    +'<div id="gPhotoPrev" style="margin-top:10px;text-align:center"></div></div>'
    +'<div style="margin-top:16px"><label class="fl">담당교사(수령자) 성명</label>'
    +'<input type="text" id="tname" placeholder="예: 홍길동" autocomplete="name" maxlength="20" value="'+esc(d.receiver||'')+'"></div>'
    +'<div class="sigwrap"><label class="fl">서명 <span style="font-weight:600;color:var(--gray)">(손가락/펜으로 서명해주세요)</span></label>'
    +'<div class="sigbox"><canvas id="sig"></canvas><div class="sighint" id="sighint">여기에 서명</div></div>'
    +'<div class="sigtools"><span style="font-size:12px;color:var(--gray)">확인 후에는 수정할 수 없습니다</span><button class="clr" onclick="clearSig()">✕ 다시</button></div></div>'
    +'<button class="btn" id="okbtn" onclick="submitGoods()">수령 확인하고 제출</button>'
    +'<div class="msg" id="msg"></div>';
  initSig();
}
// 사진 자동 압축(긴 변 1000px·JPEG) — 문서 저장 용량 안전 범위(≤약 350KB)로
function pickGoodsPhoto(input){
  const f=input.files&&input.files[0];
  const prev=document.getElementById('gPhotoPrev');
  if(!f){GOODS_PHOTO='';prev.innerHTML='';return}
  const rd=new FileReader();
  rd.onload=ev=>{
    const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height;const MAX=1000;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.8,out=cv.toDataURL('image/jpeg',q);
      while(out.length>350*1024*1.37&&q>0.4){q-=0.1;out=cv.toDataURL('image/jpeg',q);}
      GOODS_PHOTO=out;
      prev.innerHTML='<img src="'+out+'" style="max-width:100%;max-height:220px;border-radius:10px;border:1px solid #e3e6ea"><div style="font-size:12px;color:#0f766e;font-weight:800;margin-top:6px">✓ 사진 첨부 완료</div>';
    };
    img.onerror=function(){GOODS_PHOTO='';prev.innerHTML='<div style="font-size:12.5px;color:var(--red);font-weight:700">사진을 읽지 못했습니다. 다른 사진으로 시도해주세요.</div>'};
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
}
function renderGoodsDone(){
  const c=GOODS.teacherConfirm||{};
  const d=GOODS.delivery||{};
  document.getElementById('stage').innerHTML=
    gStepBar(3)
    +'<div class="done"><div class="chk">✅</div><h2>수령 확인 완료</h2>'
    +'<div style="font-size:14px;color:#555;margin-bottom:10px">'+esc(GOODS.school)+' 용품 수령이 확인되었습니다. 협조해 주셔서 감사합니다!</div></div>'
    +'<div class="row"><span class="k">수령 품목</span><span class="v" style="font-weight:600">'+esc(GOODS.items||'')+'</span></div>'
    +(d.addr?'<div class="row"><span class="k">배송지</span><span class="v" style="font-weight:600">'+esc(d.addr+' '+(d.addr2||''))+'</span></div>':'')
    +'<div class="row"><span class="k">확인 교사</span><span class="v">'+esc(c.name||'')+'</span></div>'
    +(c.at?'<div class="row"><span class="k">확인 시각</span><span class="v" style="font-weight:600;color:#777">'+esc(String(c.at).replace('T',' ').slice(0,16))+'</span></div>':'')
    +(c.photo?'<div style="margin-top:12px;text-align:center"><img src="'+c.photo+'" alt="수령 사진" style="max-width:100%;max-height:240px;border-radius:10px;border:1px solid #eee"></div>':'')
    +(c.sign?'<div style="margin-top:12px;text-align:center"><img src="'+c.sign+'" alt="서명" style="max-width:200px;border:1px solid #eee;border-radius:8px"></div>':'');
}
async function submitGoods(){
  const msg=document.getElementById('msg');
  const name=(document.getElementById('tname').value||'').trim();
  if(!GOODS_PHOTO){msg.textContent='받으신 용품 사진 1장을 먼저 첨부해주세요 (필수)';msg.className='msg err';return}
  if(!name){msg.textContent='담당교사 성명을 입력해주세요';msg.className='msg err';return}
  if(!SIGGED){msg.textContent='서명을 입력해주세요';msg.className='msg err';return}
  const btn=document.getElementById('okbtn');btn.disabled=true;msg.textContent='제출 중…';msg.className='msg';
  const tc={name:name,at:new Date().toISOString(),sign:exportSign(),photo:GOODS_PHOTO};
  try{
    await DB.collection('goodsConfirms').doc(GOODS._id).update({teacherConfirm:tc});
    GOODS.teacherConfirm=tc;renderGoodsDone();
  }catch(e){btn.disabled=false;msg.textContent='제출 실패 — 이미 확인되었거나 링크가 만료되었을 수 있습니다.';msg.className='msg err'}
}

async function submitConfirm(){
  const msg=document.getElementById('msg');
  const name=(document.getElementById('tname').value||'').trim();
  if(!name){msg.textContent='담당교사 성명을 입력해주세요';msg.className='msg err';return}
  if(!SIGGED){msg.textContent='서명을 입력해주세요';msg.className='msg err';return}
  const btn=document.getElementById('okbtn');btn.disabled=true;
  const sign=exportSign();
  const tc={name:name,at:new Date().toISOString(),sign:sign};
  let done=0,fail=0;
  for(const l of PENDING){
    msg.textContent='기록 중… '+(done+fail+1)+'/'+PENDING.length;msg.className='msg';
    try{ await DB.collection('sessionLogs').doc(l._id).update({teacherConfirm:tc}); l.teacherConfirm=tc; done++; }
    catch(e){ fail++; }
  }
  if(done){
    PENDING=ALLLOGS.filter(l=>!l.teacherConfirm);
    renderDone(tc);
  }else{
    btn.disabled=false;
    msg.textContent='제출 실패 — 이미 확인되었거나 링크가 만료되었을 수 있습니다.';msg.className='msg err';
  }
}
boot();
</script>
