<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회원 조회 · 박승재</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:'Pretendard',sans-serif;background:#f4f6fa;margin:0;padding:24px}
.card{background:#fff;border-radius:14px;padding:24px 28px;max-width:720px;margin:0 auto;box-shadow:0 2px 16px rgba(0,0,0,.08)}
h2{margin:0 0 4px;color:#153A77;font-size:19px}
.sub{color:#6b7280;font-size:13px;margin-bottom:20px}
.log{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:12px 15px;font-size:12.5px;line-height:2;min-height:60px;max-height:600px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.ok{color:#059669;font-weight:700}.er{color:#dc2626;font-weight:700}.inf{color:#1d4ed8}.warn{color:#b45309;font-weight:700}
.sec{font-weight:900;font-size:13px;color:#7c3aed;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h2>🔍 회원 조회 — 박승재</h2>
  <div class="sub">관리자 계정으로 로그인된 상태에서 열어주세요 (login.html 먼저)</div>
  <div class="log" id="log">Firebase 연결 중…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyB-YuoXtSnuodHEbbjwHRyEjdShgNu4iLg",
  authDomain:"koreaflyingdiscfederation.firebaseapp.com",
  projectId:"koreaflyingdiscfederation",
  storageBucket:"koreaflyingdiscfederation.firebasestorage.app",
  messagingSenderId:"1081847355343",
  appId:"1:1081847355343:web:ca40ed9a52e13f607f64ba"
});
const AUTH=firebase.auth(),DB=firebase.firestore();
const el=document.getElementById('log');
function log(msg,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}

AUTH.onAuthStateChanged(async user=>{
  if(!user){log('❌ 로그인 안 됨 — login.html에서 먼저 로그인하세요.','er');return;}
  log('✅ 로그인: '+user.email,'ok');

  // ── 1. users 컬렉션에서 박승재 검색 ──
  log('','');log('━━━ 1. users 컬렉션 검색 ━━━','sec');
  try{
    const snap=await DB.collection('users').where('name','==','박승재').get();
    if(snap.empty){
      log('⚠ users에서 박승재를 찾지 못했습니다 (삭제된 것 같습니다).','warn');
    } else {
      log('✅ users에서 '+snap.docs.length+'건 발견!','ok');
      snap.docs.forEach(d=>{
        const u=d.data();
        log('  문서ID: '+d.id,'ok');
        log('  이름: '+(u.name||'-')+' / 이메일: '+(u.email||'-'));
        log('  전화: '+(u.phone||'-')+' / 역할: '+(u.role||'-'));
        log('  소속: '+(u.sido||u.organization||'-')+' / 상태: '+(u.status||'-'));
        log('  가입일: '+(u.createdAt?String(u.createdAt.toDate?u.createdAt.toDate().toISOString().slice(0,10):u.createdAt).slice(0,10):'-'));
        if(u.lic||u.license)log('  자격: '+(u.lic||u.license||'-'));
      });
    }
  }catch(e){log('❌ users 조회 오류: '+e.message,'er');}

  // ── 2. staffApplications에서 박승재 신청 이력 검색 ──
  log('','');log('━━━ 2. staffApplications 검색 ━━━','sec');
  try{
    const snap=await DB.collection('staffApplications').where('name','==','박승재').get();
    if(snap.empty){
      log('⚠ staffApplications에서 박승재 신청 이력 없음.','warn');
    } else {
      log('✅ staffApplications에서 '+snap.docs.length+'건 발견!','ok');
      snap.docs.forEach(d=>{
        const a=d.data();
        log('  신청ID: '+d.id,'ok');
        log('  uid: '+(a.uid||'-'));
        log('  대회명: '+(a.competitionName||'-'));
        log('  전화: '+(a.phone||'-')+' / 자격: '+(a.lic||'-'));
        log('  신청일자: '+(a.days||[]).join(', ')||'-');
        log('  상태: '+JSON.stringify(a.status||{}));
      });
    }
  }catch(e){log('❌ staffApplications 조회 오류: '+e.message,'er');}

  // ── 3. licenses 컬렉션에서 이름으로 검색 (uid 없이) ──
  log('','');log('━━━ 3. licenses 컬렉션 검색 ━━━','sec');
  log('  ※ licenses는 uid 기반이라 이름 직접 검색 불가 — staffApplications에서 uid를 찾으면 조회합니다.','inf');

  // ── 4. Firebase Auth 이메일 추정 (이름 기반 불가, 안내만) ──
  log('','');log('━━━ 4. Auth 계정 조회 ━━━','sec');
  log('  ※ Firebase Auth는 클라이언트에서 직접 조회 불가.','inf');
  log('  → Firebase Console > Authentication > Users 탭에서 "박승재" 또는 이메일로 직접 검색하세요.','inf');

  log('','');log('━━━ 조회 완료 ━━━','sec');
  log('결과 요약: users 삭제 확인됨이면 재등록이 최선입니다. staffApplications에 이력이 있으면 uid·전화번호 등을 참고해 복구 가능.','inf');
});
</script>
</body>
</html>
