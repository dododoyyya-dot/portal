<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선정 총집계 | 대한민국플라잉디스크연맹</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--blue:#1F4E9C;--navy:#153A77;--red:#C41E2F;--green:#0f766e;--gold:#b8860b;--gray:#6b7280;--line:#e4e8ef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Malgun Gothic',sans-serif;background:#f4f6fa;color:#111;padding:26px 16px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:26px;font-weight:900;margin-bottom:4px}
.sub{font-size:13.5px;color:var(--gray);margin-bottom:20px}
.bignums{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.bn{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:0 6px 18px rgba(17,17,20,.05)}
.bn b{display:block;font-size:38px;font-weight:900;line-height:1.1}
.bn span{font-size:13px;font-weight:700;color:var(--gray)}
.bn.total{background:var(--navy);border-color:var(--navy)}
.bn.total b,.bn.total span{color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(17,17,20,.05);margin-bottom:18px}
th,td{padding:12px 14px;text-align:center;font-size:14.5px;border-bottom:1px solid var(--line)}
th{background:#eef3fa;font-weight:800;color:var(--navy);font-size:13.5px}
td:first-child,th:first-child{text-align:left;font-weight:800}
tr:last-child td{border-bottom:none}
tr.sum td{background:#f8fafc;font-weight:900;border-top:2px solid var(--navy)}
.big{font-weight:900;color:var(--blue)}
.note{font-size:12.5px;color:var(--gray);margin-bottom:26px;line-height:1.6}
.gate{background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px;text-align:center;font-size:16px;font-weight:700;display:none}
.toolbar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
#updated{font-size:12.5px;color:var(--gray)}
h2{font-size:17px;font-weight:900;margin:6px 0 10px;color:var(--navy)}
@media print{.toolbar{display:none}body{background:#fff;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 참여학교 선정 총집계</h1>
  <div class="sub">2026 유소년 스포츠 기반구축사업 — 선정·배정완료 기준 실시간 집계 (관리자·권역장 전용)</div>
  <div class="gate" id="gate"></div>
  <div id="body" style="display:none">
    <div class="toolbar">
      <button class="btn" onclick="load()">↻ 새로고침</button>
      <button class="btn ghost" onclick="window.print()">🖨 인쇄</button>
      <span id="updated"></span>
    </div>
    <div class="bignums" id="bigNums"></div>
    <h2>권역별 선정 현황 (선정 + 배정완료)</h2>
    <table id="regTable"></table>
    <h2>지원방식별 (선정교 기준)</h2>
    <table id="supTable"></table>
    <div class="note">
      · 선정교 = 상태가 [선정] 또는 [배정완료]인 신청 건 (학교 단위가 아닌 신청 건 단위 — 한 학교가 학교체육·방과후 모두 선정되면 2건으로 집계)<br>
      · 접수·대기는 아직 미선정, 취소·미선정은 집계 제외 · 권역/유형은 표준화 보정 적용
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB-YuoXtSnuodHEbbjwHRyEjdShgNu4iLg",
  authDomain: "koreaflyingdiscfederation.firebaseapp.com",
  projectId: "koreaflyingdiscfederation",
  storageBucket: "koreaflyingdiscfederation.firebasestorage.app",
  messagingSenderId: "1081847355343",
  appId: "1:1081847355343:web:ca40ed9a52e13f607f64ba"
};
firebase.initializeApp(firebaseConfig);
const AUTH = firebase.auth();
const DB = firebase.firestore();

const KFDF_REGIONS=['서울·경기','강원','충청','전라','경상','제주'];
const SIDO2REG={'서울':'서울·경기','인천':'서울·경기','경기':'서울·경기','강원':'강원','대전':'충청','세종':'충청','충청북':'충청','충북':'충청','충청남':'충청','충남':'충청','광주':'전라','전라북':'전라','전북':'전라','전라남':'전라','전남':'전라','부산':'경상','대구':'경상','울산':'경상','경상북':'경상','경북':'경상','경상남':'경상','경남':'경상','제주':'제주'};
const REG_ALIAS={'서울경기':'서울·경기','수도권':'서울·경기','서울/경기':'서울·경기','충청권':'충청','전라권':'전라','경상권':'경상','제주권':'제주','강원권':'강원'};
function appRegion(s){
  const raw=String(s.region||'').trim();
  if(KFDF_REGIONS.indexOf(raw)>=0)return raw;
  const norm=REG_ALIAS[raw.replace(/\s/g,'')];
  if(norm)return norm;
  const src=String(s.city||'')||String(s.school||'');
  for(const k in SIDO2REG){if(src.indexOf(k)===0)return SIDO2REG[k]}
  for(const k in SIDO2REG){if(String(s.school||'').indexOf(k)===0)return SIDO2REG[k]}
  return raw||'미상';
}
function appTypeOf(s){
  const t=String((s.type||'')+' '+(s.typeKey||'')).toLowerCase();
  if(t.indexOf('after')>=0||t.indexOf('방과후')>=0||t.indexOf('늘봄')>=0||t.indexOf('돌봄')>=0)return 'after';
  return 'school';
}

AUTH.onAuthStateChanged(async u=>{
  const g=document.getElementById('gate');
  if(!u){g.style.display='block';g.innerHTML='🔒 관리자 전용 페이지입니다. <a href="login.html" style="font-weight:800;color:var(--red)">로그인 →</a>';return}
  const d=await DB.collection('users').doc(u.uid).get();
  const v=d.data();
  if(!v||(v.role!=='admin'&&v.role!=='regionAdmin')){
    g.style.display='block';g.innerHTML='⛔ 관리자·권역장 권한이 없습니다.';return;
  }
  document.getElementById('body').style.display='block';
  load();
});

async function load(){
  const snap=await DB.collection('schoolApplications').get();
  const R={};KFDF_REGIONS.forEach(r=>R[r]={school:0,after:0,goods:0,self:0,dispatch:0,applied:0,wait:0});
  R['미상']={school:0,after:0,goods:0,self:0,dispatch:0,applied:0,wait:0};
  let selSchool=0,selAfter=0,goods=0,selfN=0,dispatch=0,totalApps=0,waitN=0;
  snap.forEach(doc=>{
    const s=doc.data();
    if(s.deleted)return;
    const st=s.status||'접수';
    if(st==='취소'||st==='미선정')return;
    const reg=R[appRegion(s)]?appRegion(s):'미상';
    const ty=appTypeOf(s);
    totalApps++;R[reg].applied++;
    if(st==='대기'){waitN++;R[reg].wait++;}
    if(st!=='선정'&&st!=='배정완료')return;
    if(ty==='after'){selAfter++;R[reg].after++;}else{selSchool++;R[reg].school++;}
    const sup=s.support||'강사파견+용품';
    if(sup==='용품만'){goods++;R[reg].goods++;}
    else if(sup==='본인지도+용품'||s.selfTeach){selfN++;R[reg].self++;}
    else{dispatch++;R[reg].dispatch++;}
  });
  const total=selSchool+selAfter;
  document.getElementById('bigNums').innerHTML=
    '<div class="bn total"><b>'+total+'</b><span>총 선정교 (건)</span></div>'
    +'<div class="bn"><b style="color:#8c1622">'+selSchool+'</b><span>🏫 학교체육 강습</span></div>'
    +'<div class="bn"><b style="color:#0f766e">'+selAfter+'</b><span>🌱 방과후·늘봄</span></div>'
    +'<div class="bn"><b style="color:#6b7280">'+waitN+'</b><span>⏳ 대기 (미선정)</span></div>'
    +'<div class="bn"><b style="color:#1F4E9C">'+totalApps+'</b><span>유효 신청 전체</span></div>';
  let rt='<tr><th>권역</th><th>🏫 학교체육</th><th>🌱 방과후·늘봄</th><th>선정 계</th><th>유효 신청</th><th>대기</th></tr>';
  let ts=0,ta=0,tapp=0,tw=0;
  KFDF_REGIONS.forEach(r=>{
    const c=R[r];const sum=c.school+c.after;
    ts+=c.school;ta+=c.after;tapp+=c.applied;tw+=c.wait;
    rt+='<tr><td>'+r+'</td><td>'+c.school+'</td><td>'+c.after+'</td><td class="big">'+sum+'</td><td>'+c.applied+'</td><td>'+c.wait+'</td></tr>';
  });
  if(R['미상'].applied){const c=R['미상'];ts+=c.school;ta+=c.after;tapp+=c.applied;tw+=c.wait;
    rt+='<tr><td>미상(확인 필요)</td><td>'+c.school+'</td><td>'+c.after+'</td><td class="big">'+(c.school+c.after)+'</td><td>'+c.applied+'</td><td>'+c.wait+'</td></tr>';}
  rt+='<tr class="sum"><td>합계</td><td>'+ts+'</td><td>'+ta+'</td><td class="big">'+(ts+ta)+'</td><td>'+tapp+'</td><td>'+tw+'</td></tr>';
  document.getElementById('regTable').innerHTML=rt;
  let st2='<tr><th>권역</th><th>강사파견+용품</th><th>본인지도+용품</th><th>🎁 용품만</th></tr>';
  let td2=0,tf2=0,tg2=0;
  KFDF_REGIONS.forEach(r=>{
    const c=R[r];td2+=c.dispatch;tf2+=c.self;tg2+=c.goods;
    st2+='<tr><td>'+r+'</td><td>'+c.dispatch+'</td><td>'+c.self+'</td><td>'+c.goods+'</td></tr>';
  });
  st2+='<tr class="sum"><td>합계</td><td>'+td2+'</td><td>'+tf2+'</td><td>'+tg2+'</td></tr>';
  document.getElementById('supTable').innerHTML=st2;
  document.getElementById('updated').textContent='집계 시각: '+new Date().toLocaleString('ko-KR');
}
</script>
</body>
</html>
