<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>구 심판·운영 공고 마이그레이션</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:'Pretendard',sans-serif;background:#f4f6fa;margin:0;padding:24px}
.card{background:#fff;border-radius:14px;padding:28px 32px;max-width:680px;margin:0 auto;box-shadow:0 2px 16px rgba(0,0,0,.08)}
h2{margin:0 0 6px;color:#153A77;font-size:20px}
.sub{color:#6b7280;font-size:13px;margin-bottom:24px}
.log{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px;font-size:12.5px;line-height:2;min-height:60px;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.ok{color:#059669;font-weight:700} .er{color:#dc2626;font-weight:700} .inf{color:#1d4ed8}
.btn{display:inline-block;margin-top:14px;padding:10px 24px;background:#153A77;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;border-radius:8px}
.btn:disabled{background:#9ca3af;cursor:not-allowed}
#status{margin-top:16px;font-size:14px;font-weight:700;color:#153A77}
</style>
</head>
<body>
<div class="card">
  <h2>⬆️ 구 심판·운영 공고 → 새 양식 마이그레이션</h2>
  <div class="sub">compSlots(심판·운영) → competitionStaff + staffApplications<br>
  관리자 계정으로 로그인된 상태에서 실행하세요. 이미 이전된 공고는 자동으로 건너뜁니다.</div>
  <div class="log" id="logBox">로그인 확인 중…</div>
  <div id="status"></div>
  <button class="btn" id="runBtn" disabled onclick="runMigrate()">▶ 마이그레이션 실행</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
const CFG={
  apiKey:"AIzaSyB-YuoXtSnuodHEbbjwHRyEjdShgNu4iLg",
  authDomain:"koreaflyingdiscfederation.firebaseapp.com",
  projectId:"koreaflyingdiscfederation",
  storageBucket:"koreaflyingdiscfederation.firebasestorage.app",
  messagingSenderId:"1081847355343",
  appId:"1:1081847355343:web:ca40ed9a52e13f607f64ba"
};
firebase.initializeApp(CFG);
const AUTH=firebase.auth();
const DB=firebase.firestore();

const logEl=document.getElementById('logBox');
const statusEl=document.getElementById('status');
const runBtn=document.getElementById('runBtn');
let currentUser=null,currentMe=null;

function log(msg,cls=''){
  const line=document.createElement('div');
  if(cls)line.className=cls;
  line.textContent=msg;
  logEl.appendChild(line);
  logEl.scrollTop=logEl.scrollHeight;
}

// 관리자 레벨 체크 (kfdf.js 기준)
const ADMIN_LEVELS=['연맹이사','연맹사무국','연맹회장','시도회장','시도사무국','시도이사'];
function isAdmin(me){
  if(!me)return false;
  return !!(me.systemAdmin||me.isAdmin||(me.role&&ADMIN_LEVELS.includes(me.role)));
}

AUTH.onAuthStateChanged(async user=>{
  if(!user){
    log('❌ 로그인되어 있지 않습니다. 먼저 login.html에서 로그인하세요.','er');
    return;
  }
  currentUser=user;
  try{
    const snap=await DB.collection('users').doc(user.uid).get();
    currentMe=snap.exists?snap.data():null;
  }catch(e){log('users 조회 실패: '+e.message,'er');return;}

  if(!isAdmin(currentMe)){
    log('❌ 관리자 권한이 없습니다 (현재 role: '+(currentMe&&currentMe.role||'없음')+').','er');
    return;
  }
  log('✅ 로그인 확인: '+(currentMe&&currentMe.name||user.email)+' / '+(currentMe&&currentMe.role||''),'ok');
  log('▶ "마이그레이션 실행" 버튼을 눌러 시작하세요.','inf');
  runBtn.disabled=false;
});

function ckey(c){return (c&&c.uid)||''}

async function runMigrate(){
  runBtn.disabled=true;
  statusEl.textContent='';
  log('─────────────────────────','');
  log('🔍 compSlots 조회 중 (role: 심판 또는 운영)…','inf');

  let snap;
  try{
    snap=await DB.collection('compSlots').where('role','in',['심판','운영']).get();
  }catch(e){log('❌ 조회 실패: '+e.message,'er');runBtn.disabled=false;return;}

  const toMigrate=snap.docs.filter(d=>!d.data()._migrated);
  log('총 '+snap.docs.length+'건 조회됨, 미이전: '+toMigrate.length+'건');

  if(!toMigrate.length){
    log('✅ 마이그레이션할 공고가 없습니다 (모두 완료됨).','ok');
    statusEl.textContent='완료';
    runBtn.disabled=false;
    return;
  }

  const DOW=['일','월','화','수','목','금','토'];
  // 기본 역할 템플릿
  const DEFAULT_ROLES={
    '심판':['주심','부심','선심','기록원'],
    '운영':['경기운영','안내','시설관리','사무국']
  };

  let postCount=0,appCount=0;

  for(const d of toMigrate){
    const s=d.data();
    log('\n📋 공고: ['+d.id+'] '+s.title,'inf');
    log('   역할: '+s.role+' / 날짜: '+s.date+' / 마감: '+s.deadline);
    log('   지역: '+(s.region||s.bySido||'미기재')+' / 모집: '+(s.quota||0)+'명');
    log('   신청자(claimed): '+((s.claimed||[]).length)+'건, 취소(cancels): '+((s.cancels||[]).length)+'건');
    log('   확정(confirmed): '+JSON.stringify(s.confirmed||[]));

    const dateStr=s.date||'';
    const dow=dateStr?DOW[new Date(dateStr+'T00:00:00').getDay()]:'';
    const roles=s.roles||(DEFAULT_ROLES[s.role]||[]);

    const staffPost={
      competitionName:s.title||'',
      startDate:dateStr,
      endDate:dateStr,
      location:s.region||s.bySido||'',
      deadline:s.deadline||'',
      sport:'플라잉디스크',
      time:'',
      description:s.note||'',
      dates:[{
        date:dateStr,
        dayOfWeek:dow,
        roles:roles,
        quota:{total:s.quota||0},
        allowance:{mode:'미정',items:[]}
      }],
      transportation:'안내문 참조',
      meal:'안내문 참조',
      uniform:'안내문 참조',
      lodging:'미제공',
      author:{
        uid:s.byUid||'',
        name:s.byName||'',
        organization:s.bySido||'',
        contact:''
      },
      approved:true,
      _migratedFrom:d.id,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };

    let newRef;
    try{
      newRef=await DB.collection('competitionStaff').add(staffPost);
      postCount++;
      log('   ✅ competitionStaff 생성: '+newRef.id,'ok');
    }catch(e){
      log('   ❌ competitionStaff 생성 실패: '+e.message,'er');
      continue;
    }

    // ── 신청자 이전 ──
    const claimed=s.claimed||[];
    const cancels=s.cancels||[];
    const confirmed=s.confirmed||[];
    const seen=new Set();

    for(const c of claimed){
      const uid=ckey(c);
      if(!uid||seen.has(uid))continue;

      // 취소 여부 확인 (claimed 횟수 > cancels 횟수이면 유효 신청)
      const claimCount=claimed.filter(x=>ckey(x)===uid).length;
      const cancelCount=cancels.filter(x=>ckey(x)===uid).length;
      if(claimCount<=cancelCount){
        log('   ↩ '+uid+' : 취소된 신청, 건너뜀');
        continue;
      }
      seen.add(uid);

      // 사용자 정보 조회
      let phone='',lic='',userName=c.name||'';
      try{
        const usnap=await DB.collection('users').doc(uid).get();
        if(usnap.exists){
          const ud=usnap.data();
          phone=ud.phone||'';
          if(!userName)userName=ud.name||'';
        }
      }catch(e){log('   ⚠ users/'+uid+' 조회 실패: '+e.message);}

      try{
        const lsnap=await DB.collection('licenses').where('uid','==',uid).get();
        lic=lsnap.docs.map(l=>{
          const ld=l.data();
          const tp=ld.type||'';
          const gr=ld.grade||'';
          return [tp,gr].filter(Boolean).join(' ');
        }).filter(Boolean).join(' · ');
      }catch(e){log('   ⚠ licenses/'+uid+' 조회 실패: '+e.message);}

      const isConfirmed=confirmed.includes(uid);
      const status=dateStr?{[dateStr]:isConfirmed?'확정':'대기'}:{};
      const prefs=dateStr?{[dateStr]:c.prefs||[]}:{};

      try{
        const appRef=await DB.collection('staffApplications').add({
          postId:newRef.id,
          competitionName:s.title||'',
          uid,
          name:userName,
          phone,
          lic,
          days:dateStr?[dateStr]:[],
          prefs,
          status,
          agree:{
            privacy:true,
            rules:true,
            safety:true,
            signed:!!(c.signed),
            at:c.at||new Date().toISOString()
          },
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        appCount++;
        log('   ✅ 신청자 이전: '+userName+' ('+uid+') → '+(isConfirmed?'확정':'대기')+' ['+appRef.id+']','ok');
      }catch(e){
        log('   ❌ staffApplications 생성 실패('+uid+'): '+e.message,'er');
      }
    }

    // 구 공고에 마이그레이션 완료 표시
    try{
      await DB.collection('compSlots').doc(d.id).update({
        _migrated:true,
        _migratedTo:newRef.id,
        _migratedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      log('   ✅ 구 공고 _migrated:true 표시 완료','ok');
    }catch(e){
      log('   ❌ 구 공고 업데이트 실패: '+e.message,'er');
    }
  }

  log('\n─────────────────────────');
  log('🎉 마이그레이션 완료!','ok');
  log('   공고 '+postCount+'건 이전, 신청자 '+appCount+'명 이전','ok');
  statusEl.textContent='✅ 완료: 공고 '+postCount+'건, 신청자 '+appCount+'명';

  log('\n⚠ 이 페이지는 삭제하거나 /upload/main에서 제거하세요 (1회용).');
  runBtn.textContent='완료됨';
}
</script>
</body>
</html>
